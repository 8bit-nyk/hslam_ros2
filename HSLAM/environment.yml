# Conda environment for the HSLAM 3D Gaussian Splatting integration.
# Mirrors the "surfel_splatting" env from the 2DGS project: Python 3.8 + PyTorch 2.0.0,
# which also provides the modern libstdc++ that the HSLAM binary links against
#
# NOTE: the 2DGS-only pip submodules (diff-surfel-rasterization, simple-knn) are intentionally
# omitted -- HSLAM builds its own CUDA rasterizer and simple-knn in-tree (see CMakeLists.txt).
name: surfel_splatting
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - ffmpeg=4.2.2
  - pillow=10.2.0
  - pip=23.3.1
  - python=3.8.18
  - pytorch=2.0.0
  - torchaudio=2.0.0
  - torchvision=0.15.0
  - typing_extensions=4.9.0
  - pip:
    - open3d==0.18.0
    - mediapy==1.1.2
    - lpips==0.1.4
    - scikit-image==0.21.0
    - tqdm==4.66.2
    - trimesh==4.3.2
    - plyfile
    - opencv-python 